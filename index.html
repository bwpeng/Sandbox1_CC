<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚽ FIFA World Cup 2026 — Live Scores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Floating soccer balls background -->
  <div class="bg-balls" id="bgBalls"></div>

  <!-- ===== LANDING PAGE ===== -->
  <div class="landing">
    <div class="landing-content">
      <div class="trophy-wrap">
        <div class="trophy">🏆</div>
        <div class="trophy-rays"></div>
      </div>

      <!-- Cartoon soccer ball SVG above title -->
      <svg class="big-ball" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="47" fill="white" stroke="#111" stroke-width="4"/>
        <!-- Cartoon pentagon patches -->
        <polygon points="50,20 62,31 57,45 43,45 38,31" fill="#111" stroke="#111" stroke-width="2"/>
        <polygon points="50,80 62,69 57,55 43,55 38,69" fill="#111" stroke="#111" stroke-width="2"/>
        <polygon points="20,40 32,32 44,40 40,53 27,53" fill="#111" stroke="#111" stroke-width="2"/>
        <polygon points="80,40 68,32 56,40 60,53 73,53" fill="#111" stroke="#111" stroke-width="2"/>
        <polygon points="20,60 27,47 40,47 44,60 32,68" fill="#111" stroke="#111" stroke-width="2"/>
        <polygon points="80,60 73,47 60,47 56,60 68,68" fill="#111" stroke="#111" stroke-width="2"/>
      </svg>

      <h1 class="main-title">FIFA WORLD CUP</h1>
      <h2 class="year-badge">2026™</h2>
      <p class="host-line">🇺🇸 USA &nbsp;·&nbsp; 🇨🇦 CANADA &nbsp;·&nbsp; 🇲🇽 MEXICO</p>
      <div class="date-chip" id="dateChip">Today</div>

      <button class="open-btn" id="openScoresBtn">
        <span class="open-btn-ball">⚽</span>
        <span>VIEW LIVE SCORES</span>
        <span class="open-btn-live-dot"></span>
      </button>

      <p class="scroll-hint">Real-time scores · powered by TheSportsDB</p>
    </div>

    <!-- Cartoon pitch markings at the bottom -->
    <div class="pitch-footer">
      <div class="pitch-center-circle"></div>
      <div class="pitch-center-line"></div>
    </div>
  </div>

  <!-- ===== SCORES POPUP ===== -->
  <div class="popup-overlay" id="scoresPopup">
    <div class="popup" role="dialog" aria-label="FIFA World Cup Live Scores">

      <!-- Header -->
      <div class="popup-header">
        <div class="popup-logo">
          <span class="header-ball" id="headerBall">⚽</span>
          <div>
            <div class="popup-title">FIFA WORLD CUP 2026™</div>
            <div class="popup-subtitle" id="popupSubtitle">Live Scores</div>
          </div>
        </div>
        <button class="close-btn" id="closeScoresBtn" aria-label="Close">✕</button>
      </div>

      <!-- Tabs -->
      <div class="tabs-bar">
        <button class="tab-btn active" data-tab="live">
          <span class="tab-live-dot"></span>LIVE
        </button>
        <button class="tab-btn" data-tab="upcoming">📅 UPCOMING</button>
        <button class="tab-btn" data-tab="results">✅ RESULTS</button>
      </div>

      <!-- Match list -->
      <div class="matches-area" id="matchesArea"></div>

      <!-- Footer -->
      <div class="popup-footer">
        <div class="footer-status">
          <span class="footer-pulse"></span>
          <span id="updatedAt">Live · data by TheSportsDB</span>
        </div>
        <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
      </div>
    </div>
  </div>

  <!-- ===== MATCH DETAIL POPUP ===== -->
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-popup" id="detailPopup" role="dialog" aria-label="Match Details">
      <button class="close-btn detail-close" id="closeDetailBtn" aria-label="Close">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <!-- Goal celebration overlay -->
  <div class="goal-overlay" id="goalOverlay">
    <div class="goal-text">GOAL! ⚽</div>
  </div>

  <!-- Confetti -->
  <div id="confettiRoot"></div>

  <script src="js/app.js"></script>
</body>
</html>
